<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DVR TV - Controle Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f17;
            color: #f1f5f9;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* Top Header */
        header.mobile-header {
            background: linear-gradient(180deg, #131c2e 0%, #0b0f17 100%);
            border-bottom: 1px solid #1e293b;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-badge {
            background: #2563eb;
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }
        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }
        .header-subtitle {
            font-size: 11px;
            color: #94a3b8;
        }
        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .sync-status.disconnected {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .nav-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #9ca3af;
            background: none;
            border: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .nav-tab.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
        }

        /* Content Container */
        .tab-content {
            padding: 16px;
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* TV Status Banner */
        .tv-status-card {
            background: #131d2e;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tv-info-left h3 {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .tv-info-left .tv-view-name {
            font-size: 17px;
            font-weight: 700;
            color: #38bdf8;
        }
        .tv-badges {
            display: flex;
            gap: 6px;
        }
        .pill-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .pill-fluido {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .pill-hd {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .pill-grid {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.4);
        }

        /* D-Pad Virtual Remote */
        .dpad-section {
            background: #131c2e;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
        }
        .dpad-container {
            width: 220px;
            height: 220px;
            position: relative;
            margin: 10px auto;
        }
        .dpad-btn {
            position: absolute;
            background: #1e293b;
            color: #f8fafc;
            border: 2px solid #334155;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .dpad-btn:active {
            background: #38bdf8;
            color: #0b0f17;
            transform: scale(0.95);
        }
        .dpad-up {
            top: 0;
            left: 70px;
            width: 80px;
            height: 70px;
            border-radius: 14px 14px 4px 4px;
        }
        .dpad-down {
            bottom: 0;
            left: 70px;
            width: 80px;
            height: 70px;
            border-radius: 4px 4px 14px 14px;
        }
        .dpad-left {
            top: 70px;
            left: 0;
            width: 70px;
            height: 80px;
            border-radius: 14px 4px 4px 14px;
        }
        .dpad-right {
            top: 70px;
            right: 0;
            width: 70px;
            height: 80px;
            border-radius: 4px 14px 14px 4px;
        }
        .dpad-ok {
            top: 70px;
            left: 70px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #0284c7;
            border: 3px solid #38bdf8;
            font-size: 16px;
            font-weight: 900;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
        }
        .dpad-ok:active {
            background: #38bdf8;
            color: #000;
        }

        /* Remote Actions Grid */
        .remote-actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }
        .action-btn {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
        }
        .action-btn:active {
            background: #334155;
            transform: scale(0.97);
        }
        .action-btn.btn-back {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }
        .action-btn.btn-quality {
            background: rgba(234, 179, 8, 0.15);
            border-color: rgba(234, 179, 8, 0.4);
            color: #fde047;
        }
        .action-btn.btn-grid {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }
        .action-btn.btn-settings {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: #7dd3fc;
        }

        /* Camera List / Gallery */
        .cameras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .mobile-cam-card {
            background: #131c2e;
            border: 2px solid #1e293b;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .mobile-cam-card.selected {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }
        .mobile-cam-card.offline {
            opacity: 0.6;
        }
        .mobile-cam-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: #000;
        }
        .mobile-cam-details {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .mobile-cam-name {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mobile-cam-status {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .mobile-cam-status.online {
            background: #059669;
            color: #fff;
        }
        .mobile-cam-status.offline {
            background: #475569;
            color: #cbd5e1;
        }

        /* Login Modal */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 15, 23, 0.95);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #131c2e;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-logo-badge {
            background: #2563eb;
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            padding: 8px 18px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .login-card h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
        }
        .login-card p {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin-top: 4px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: #0b0f17;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 15px;
            outline: none;
        }
        .form-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
        }
        .btn-submit:active {
            background: #0369a1;
        }
        .login-error {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        /* Toast feedback */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #38bdf8;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho Mobile -->
    <header class="mobile-header">
        <div class="header-title-box">
            <span class="app-badge">TV</span>
            <div>
                <div class="header-title">DVR TV Mobile</div>
                <div class="header-subtitle">Controle Remoto & Câmeras</div>
            </div>
        </div>
        <div id="sync-status" class="sync-status">
            <span class="sync-dot"></span>
            <span id="sync-label">Conectado</span>
        </div>
    </header>

    <!-- Abas de Navegação -->
    <div class="nav-tabs">
        <button id="tab-btn-remote" class="nav-tab active" onclick="switchTab('remote')">Controle TV</button>
        <button id="tab-btn-cams" class="nav-tab" onclick="switchTab('cams')">Câmeras (<span id="cams-count">0</span>)</button>
    </div>

    <!-- Aba 1: Controle Remoto TV -->
    <div id="tab-remote" class="tab-content active">
        <!-- Status Atual da TV -->
        <div class="tv-status-card">
            <div class="tv-info-left">
                <h3>Visualização na TV</h3>
                <div id="tv-current-view" class="tv-view-name">Grade 4x4</div>
            </div>
            <div class="tv-badges">
                <span id="badge-quality" class="pill-badge pill-fluido">Fluido</span>
                <span id="badge-grid" class="pill-badge pill-grid">Auto</span>
            </div>
        </div>

        <!-- D-Pad Virtual -->
        <div class="dpad-section">
            <div class="dpad-container">
                <button class="dpad-btn dpad-up" onclick="sendCommand('dpad_up')">▲</button>
                <button class="dpad-btn dpad-left" onclick="sendCommand('dpad_left')">◄</button>
                <button class="dpad-btn dpad-ok" onclick="sendCommand('dpad_ok')">OK</button>
                <button class="dpad-btn dpad-right" onclick="sendCommand('dpad_right')">►</button>
                <button class="dpad-btn dpad-down" onclick="sendCommand('dpad_down')">▼</button>
            </div>

            <!-- Botões de Ação Rápida -->
            <div class="remote-actions-grid">
                <button class="action-btn btn-back" onclick="sendCommand('dpad_back')">
                    <span>🔙 Voltar / Menu</span>
                </button>
                <button class="action-btn btn-quality" onclick="sendCommand('toggle_quality')">
                    <span>⚡ HD / Fluido</span>
                </button>
                <button class="action-btn btn-grid" onclick="cycleGridMode()">
                    <span>🔲 Mudar Grade</span>
                </button>
                <button class="action-btn" onclick="sendCommand('toggle_offline')">
                    <span>👁️ Sem Sinal Sim/Não</span>
                </button>
                <button class="action-btn btn-settings" onclick="sendCommand('open_settings')">
                    <span>⚙️ Configurações</span>
                </button>
                <button class="action-btn" onclick="sendCommand('reconnect')">
                    <span>🔄 Reconectar DVR</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Aba 2: Lista de Câmeras -->
    <div id="tab-cams" class="tab-content">
        <div id="cameras-container" class="cameras-grid">
            <!-- Gerado dinamicamente -->
        </div>
    </div>

    <!-- Modal de Login Seguro -->
    <div id="login-modal" class="login-overlay">
        <div class="login-card">
            <div class="login-logo">
                <div class="login-logo-badge">DVR TV</div>
                <h2>Acesso ao Sistema</h2>
                <p>Digite o usuário e senha do DVR para controlar o aplicativo pelo celular</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-user">Usuário</label>
                    <input type="text" id="login-user" class="form-input" placeholder="admin" value="admin" required autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="login-pass">Senha</label>
                    <input type="password" id="login-pass" class="form-input" placeholder="Digite a senha" required />
                </div>
                <button type="submit" class="btn-submit">Entrar no Controle</button>
                <div id="login-error" class="login-error">Usuário ou senha incorretos</div>
            </form>
        </div>
    </div>

    <!-- Toast de Feedback -->
    <div id="toast" class="toast">Comando enviado!</div>

    <script>
        let sessionToken = localStorage.getItem('mobile_session_token') || '';
        let lastTvState = null;
        let pollTimer = null;
        const gridModes = ['auto', '1x1', '2x2', '3x3', '4x4', '5x5', '6x6'];
        let currentGridIdx = 0;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (tab === 'remote') {
                document.getElementById('tab-btn-remote').classList.add('active');
                document.getElementById('tab-remote').classList.add('active');
            } else {
                document.getElementById('tab-btn-cams').classList.add('active');
                document.getElementById('tab-cams').classList.add('active');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const errEl = document.getElementById('login-error');
            errEl.style.display = 'none';

            try {
                const res = await fetch('/api/mobile/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();
                if (data.success && data.token) {
                    sessionToken = data.token;
                    localStorage.setItem('mobile_session_token', sessionToken);
                    document.getElementById('login-modal').style.display = 'none';
                    showToast('Autenticado com sucesso!');
                    startStatePolling();
                } else {
                    errEl.textContent = data.error || 'Credenciais inválidas';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = 'Erro ao conectar ao servidor local';
                errEl.style.display = 'block';
            }
        }

        async function sendCommand(cmd, channelId, value) {
            if (!sessionToken) {
                document.getElementById('login-modal').style.display = 'flex';
                return;
            }

            try {
                const res = await fetch('/api/remote/command', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-session-token': sessionToken
                    },
                    body: JSON.stringify({ command: cmd, channelId: channelId, value: value })
                });

                if (res.status === 401) {
                    sessionToken = '';
                    localStorage.removeItem('mobile_session_token');
                    document.getElementById('login-modal').style.display = 'flex';
                    return;
                }

                showToast('Comando enviado à TV');
            } catch (err) {
                showToast('Falha ao comunicar com a TV');
            }
        }

        function cycleGridMode() {
            currentGridIdx = (currentGridIdx + 1) % gridModes.length;
            const nextMode = gridModes[currentGridIdx];
            sendCommand('set_grid', null, nextMode);
        }

        async function fetchTvState() {
            if (!sessionToken) return;

            try {
                const res = await fetch('/api/mobile/state', {
                    headers: { 'x-session-token': sessionToken }
                });

                if (res.status === 401) {
                    sessionToken = '';
                    localStorage.removeItem('mobile_session_token');
                    document.getElementById('login-modal').style.display = 'flex';
                    return;
                }

                const data = await res.json();
                if (data.success && data.state) {
                    updateUIWithTvState(data.state);
                    setSyncStatus(true);
                }
            } catch (err) {
                setSyncStatus(false);
            }
        }

        function setSyncStatus(connected) {
            const el = document.getElementById('sync-status');
            const label = document.getElementById('sync-label');
            if (connected) {
                el.className = 'sync-status';
                label.textContent = 'TV Sincronizada';
            } else {
                el.className = 'sync-status disconnected';
                label.textContent = 'Desconectado';
            }
        }

        function updateUIWithTvState(state) {
            lastTvState = state;

            // Visualização atual na TV
            const viewEl = document.getElementById('tv-current-view');
            if (state.currentView === 'fullscreen') {
                viewEl.textContent = 'Tela Cheia: ' + (state.selectedCameraName || ('Câmera ' + state.selectedChannelId));
            } else {
                viewEl.textContent = 'Grade (' + (state.gridMode || 'Auto').toUpperCase() + ')';
            }

            // Badges
            const qEl = document.getElementById('badge-quality');
            if (state.quality === 'main') {
                qEl.className = 'pill-badge pill-hd';
                qEl.textContent = 'HD 1080P';
            } else {
                qEl.className = 'pill-badge pill-fluido';
                qEl.textContent = 'FLUIDO';
            }

            const gEl = document.getElementById('badge-grid');
            gEl.textContent = (state.gridMode || 'Auto').toUpperCase();

            // Câmeras
            if (state.channels && state.channels.length > 0) {
                document.getElementById('cams-count').textContent = state.channels.length;
                renderCameras(state.channels, state.selectedChannelId);
            }
        }

        function renderCameras(channels, selectedId) {
            const container = document.getElementById('cameras-container');
            container.innerHTML = '';

            channels.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'mobile-cam-card' + (ch.id === selectedId ? ' selected' : '') + (ch.isOnline ? '' : ' offline');
                
                const snapUrl = '/api/snapshot/' + ch.id + '/2?t=' + Date.now();
                card.innerHTML = 
                    '<img class="mobile-cam-thumb" src="' + snapUrl + '" alt="' + ch.name + '" loading="lazy" />' +
                    '<div class="mobile-cam-details">' +
                        '<div class="mobile-cam-name">CH ' + ch.id + ' • ' + ch.name + '</div>' +
                        '<span class="mobile-cam-status ' + (ch.isOnline ? 'online' : 'offline') + '">' +
                            (ch.isOnline ? 'AO VIVO' : 'SEM SINAL') +
                        '</span>' +
                    '</div>';

                card.onclick = () => {
                    sendCommand('select_camera', ch.id);
                    sendCommand('open_fullscreen', ch.id);
                };

                container.appendChild(card);
            });
        }

        function startStatePolling() {
            if (pollTimer) clearInterval(pollTimer);
            fetchTvState();
            pollTimer = setInterval(fetchTvState, 1500);
        }

        // Inicialização
        if (sessionToken) {
            document.getElementById('login-modal').style.display = 'none';
            startStatePolling();
        } else {
            document.getElementById('login-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
